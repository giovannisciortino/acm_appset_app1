apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-noprod3-service3
  namespace: app1-noprod3
  labels:
    app: service3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service3
  template:
    metadata:
      labels:
        app: service3
    spec:
      containers:
      - name: main
        image: quay.io/gsciorti/openshift4/ose-hello-openshift-rhel8
        ports:
        - containerPort: 8080
